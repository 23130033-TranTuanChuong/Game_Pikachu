<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main">
    <div class="header">
        <div id="title">GAME PIKACHU</div>
        <div class="header_option">
            <div id="score">Your Score: 0</div>
            <div id="time_left">Time left: 2p12s</div>
            <div class="choose_level">
                <label for="level_option">Current Level:</label>
                <select id="level_option">
                    <option value="1">Level 1</option>
                    <option value="2">Level 2</option>
                    <option value="3">Level 3</option>
                </select>
            </div>
            <button id="shuffle_bt">Shuffle</button>
            <button id="restart_bt">Restart</button>
        </div>
    </div>
    <div class="main_board">
        <div id="line_connected"></div>
        <div id="board"></div>
    </div>
</div>
<script src="js/level2.js"></script>
<script src="js/level1.js"></script>
</body>
</html>
