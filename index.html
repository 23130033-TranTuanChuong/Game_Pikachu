<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pikachu Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .main{
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background-color: #FFEFBA;
        }

        .header{
            display: flex;
            flex-direction: column;
        }

        .header_option{
            display: flex;
            gap: 5px;
            margin: 7px;
        }

        #title{
            color: #FFB04B;
            font-size: 25px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        select{
            outline: none;
        }

        #restart_bt{
            padding: 3px;
            background-color: #FFD36A;
            border-radius: 3px;
            border: none;
        }

        #restart_bt:hover{
            background-color: #FFC161;
        }

        #shuffle_bt{
            padding: 3px;
            background-color: #FFD36A;
            border-radius: 3px;
            border: none;
        }

        #shuffle_bt:hover{
            background-color: #FFC161;
        }

        .main_board{
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        #board{
            display: grid;
            width: fit-content;
        }

        .tile {
            width: 30px;
            height: 30px;
            background-color: #FFE5A6;
            border-radius: 3px;
            border: 1px solid #FFCE9A;
            background-size: 28px 28px;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tile:hover {
            background-color: #FFCF85;
        }

        .tile.active {
            background-color: #FFCF85;
        }

        .tile.empty{
            visibility: hidden;
        }

        .result_display.start_mode{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .bt_start{
            padding: 3px;
            background-color: #FFD36A;
            border-radius: 3px;
            border: none;
            width: 80px;
            height: 30px;
        }

        .bt_start:hover{
            background-color: #FFC161;
        }

        #board.result_display{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 480px;
            height: 285px;
        }

        .display_win{
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            color: #FFB432;
        }

        .display_loss{
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            color: #8E403A;
        }

        .tile.frozen{
            background-color: #6AB5FF;
            opacity: 0.5;
            pointer-events: none;
        }

        .tile.hidden{
            background-color: #FFCE9A;
            pointer-events: none;
            background-image: none !important;
        }

        .tile.hidden img{
            display: none;
        }

        .tile.marked_1{
            background-color: #FFD8A6;
            pointer-events: none;
        }

        .tile.marked_2{
            background-color: #FFCE9A;
            background-image: none !important;
            pointer-events: none;
        }

        .tile.marked_2 img{
            display: none;
        }

        .tile.locked{
            background-color: #FFCF85;
            pointer-events: none;
        }

        .tile.curse{
            background-color: #A3B5FF;
        }
    </style>
</head>
<body>
<div class="main">
    <div class="header">
        <div class="header_option">
            <div id="score">Your Score: 0</div>
            <div id="time_left">Time left: 8m 0s</div>
            <div class="choose_level">
                <label for="level_option">Current Level:</label>
                <select id="level_option">
                    <option value="1">Level 1</option>
                    <option value="2">Level 2</option>
                    <option value="3">Level 3</option>
                    <option value="4">Level 4</option>
                    <option value="5">Level 5</option>
                    <option value="6">Level 6</option>
                </select>
            </div>
            <button id="shuffle_bt">Shuffle</button>
            <button id="restart_bt">Restart</button>
        </div>
    </div>
    <div class="main_board">
        <div id="board"></div>
    </div>
</div>
<audio id="bgMusic" src="img/church.mp3" loop></audio>
<script src="game.js"></script>
</body>
</html>
